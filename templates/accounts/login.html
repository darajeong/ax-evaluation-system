<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AX 평가 시스템</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f7f9fc;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 360px;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .login-card h1 {
            text-align: center;
            margin: 0 0 30px;
            font-size: 26px;
        }

        .login-card label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        .login-card input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #d9dee8;
            border-radius: 8px;
            font-size: 14px;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #4f7cff;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .password-link {
            text-align: right;
            margin: 12px 0 20px;
        }

        .password-link a {
            color: #4f7cff;
            font-size: 13px;
            text-decoration: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 24px 0;
            color: #999;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e1e5ec;
        }

      .google-button {
    display: block;
    box-sizing: border-box;
    width: 100%;
    padding: 12px;
    border: 1px solid #d9dee8;
    border-radius: 8px;
    background: white;
    color: #222;
    font-size: 14px;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
}

        .error-message {
            color: #d93025;
            font-size: 13px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <h1>AX 평가 시스템</h1>

        <form method="post">
            {% csrf_token %}

            <label for="username">아이디</label>
            <input
                type="text"
                name="username"
                id="username"
                placeholder="아이디를 입력해주세요"
            >

            <label for="password">비밀번호</label>
            <input
                type="password"
                name="password"
                id="password"
                placeholder="비밀번호를 입력해주세요"
            >

            {% if error %}
                <p class="error-message">{{ error }}</p>
            {% endif %}

            <button class="login-button" type="submit">
                로그인
            </button>
        </form>

        <div class="password-link">
            <a href="#">비밀번호를 잊으셨나요?</a>
        </div>

        <div class="divider">
            또는
        </div>

        <a class="google-button" href="/accounts/google/login/">
    Google로 로그인
</a>

    </div>

</body>
</html>
